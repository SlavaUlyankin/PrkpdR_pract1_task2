<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Учебный WebAR-проект: трекинг изображения-маркера и показ 3D-модели вазы (MindAR + A-Frame)." />
  <title>WebAR — трекинг маркера (MindAR + A-Frame)</title>

  <!-- ==========================================================
       ПОДКЛЮЧЕНИЕ БИБЛИОТЕК ЧЕРЕЗ CDN
       1) A-Frame — фреймворк для построения WebXR/3D сцен поверх Three.js
       2) MindAR (image) — модуль трекинга изображений, собранный как
          компонент для A-Frame (mindar-image-aframe)
       Версии зафиксированы (не "latest"), чтобы проект не сломался
       при выходе новых релизов.
     ========================================================== */-->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Базовые стили страницы, чтобы AR-сцена занимала весь экран */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Небольшая подсказка пользователю поверх видео с камеры */
    #hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 90%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Подсказка для пользователя -->
  <div id="hint">Наведите камеру на маркер, чтобы увидеть 3D-модель вазы</div>

  <!-- ==========================================================
       ГЛАВНАЯ AR-СЦЕНА
       mindar-image: путь к скомпилированному файлу targets.mind
         - imageTargetSrc  — путь к targets.mind (лежит рядом с index.html)
         - autoStart       — запускать камеру автоматически при загрузке
         - uiScanning      — показывать встроенную рамку сканирования MindAR
         - uiLoading       — показывать экран загрузки, пока грузятся ресурсы
       embedded: true      — сцена встраивается в страницу (а не открывается
                              на весь экран отдельным контекстом)
       vr-mode-ui: enabled: false — отключаем стандартную кнопку VR A-Frame,
                              она не нужна для WebAR-трекинга изображений
       device-orientation-permission-ui — запрос разрешения на доступ
                              к сенсорам ориентации (нужно для iOS Safari)
     ========================================================== */-->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >

    <!-- ==========================================================
         РЕСУРСЫ СЦЕНЫ (предзагрузка)
         Загружаем glTF-модель заранее в <a-assets>, чтобы она была
         полностью готова к моменту, когда пользователь наведёт камеру
         на маркер — иначе появление модели будет "с задержкой".
       ========================================================== */-->
    <a-assets>
      <a-asset-item id="vase-model" src="./models/ceramic_vase.glb"></a-asset-item>
    </a-assets>

    <!-- ==========================================================
         ОСВЕЩЕНИЕ СЦЕНЫ
         Без источников света glTF-модель со стандартным материалом
         (MeshStandardMaterial) в A-Frame будет выглядеть чёрной.
         ambient  — равномерная фоновая подсветка со всех сторон,
                    убирает полностью чёрные тени
         directional — направленный "солнечный" свет, создаёт объём
                    и мягкие тени на модели
       ========================================================== */-->
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light
      type="directional"
      color="#ffffff"
      intensity="0.8"
      position="1 1 1"
    ></a-light>

    <!-- ==========================================================
         КАМЕРА
         В MindAR камера не требует ручного управления позицией —
         компонент mindar-image сам двигает виртуальную камеру
         в соответствии с положением реального устройства.
         look-controls / wasd-controls отключены, т.к. навигация
         в AR-сцене происходит движением самого телефона, а не мышью.
       ========================================================== */-->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
    ></a-camera>

    <!-- ==========================================================
         ЦЕЛЬ ТРЕКИНГА (image target)
         targetIndex: 0 — индекс маркера внутри файла targets.mind.
         Если вы скомпилировали targets.mind из ОДНОГО изображения,
         его индекс всегда равен 0. Если маркеров несколько, для
         каждого создаётся свой <a-entity mindar-image-target> со
         своим targetIndex (0, 1, 2...).

         Всё, что находится ВНУТРИ этого <a-entity>, автоматически
         появляется/скрывается и позиционируется поверх маркера,
         когда камера его видит/теряет.
       ========================================================== */-->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- ==========================================================
           3D-МОДЕЛЬ ВАЗЫ
           gltf-model="#vase-model" — ссылка на предзагруженный ассет
           position — сдвиг модели относительно центра маркера
                      (0.35 по Y — чтобы модель "стояла" над плоскостью
                      маркера, а не проваливалась в неё)
           rotation — модель повёрнута лицом к камере
           scale    — единицы MindAR привязаны к размеру маркера
                      (маркер = условная плоскость 1x1), поэтому
                      реальные glTF-модели почти всегда нужно
                      уменьшать/увеличивать подбором
           animation — лёгкое плавное вращение модели для наглядности,
                      можно убрать, если по заданию нужна статичная модель
         ========================================================== */-->
      <a-gltf-model
        src="#vase-model"
        position="0 -3 0"
        rotation="0 0 0"
        scale="1.6 1.6 1.6"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
      ></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    // Скрываем текстовую подсказку, как только маркер найден,
    // и показываем её снова, если маркер потерян из вида камеры.
    document.addEventListener("DOMContentLoaded", () => {
      const hint = document.getElementById("hint");
      const target = document.querySelector("[mindar-image-target]");

      target.addEventListener("targetFound", () => {
        hint.style.display = "none";
      });

      target.addEventListener("targetLost", () => {
        hint.style.display = "block";
      });
    });
  </script>
</body>
</html>
